<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student ID Card</title>
  <link rel="stylesheet" href="./stylee/card.css">
</head>

<body>
  <div class="id-card">
    <div class="id-header">
      <h2>Saylani Mass Information Training</h2>
      <p>Knowledge Today, Success Tomorrow</p>
    </div>
    <div class="photo">
      <img id="cardImage" src="student-photo.jpg" alt="Student Photo" width="100" height="100"> 
    </div>
    <div class="details">
      <h3 id="cName">Raheel</h3>
      <p id="cFather"><strong>Father Name:</strong> haiderr</p>
      <p id="cCourse"><strong>Course:</strong> Computer Science</p>
      <p id="cCNIC"><strong>CNIC: </strong>42101-1234567-8 </p>
      <p id="cGender"><strong>Gender:</strong> Male</p>
      <p id="cGmail"><strong>Gmail:</strong> raheel@example.com</p>
      <p id="cId"><strong>ID Card No.:</strong> SMIT202500123</p>
      <div class="barcode">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTyb_z2vBfzfhnzbQGi3FehrR82tPzaBvjWCA&s"
          alt="Barcode">
        <div class="barcode-text">SMIT202500123</div>
      </div>
    </div>
  </div>

<script src="app.js"></script>
</body>

</html>
