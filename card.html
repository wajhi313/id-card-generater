<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student ID Card</title>
  <link rel="stylesheet" href="./stylee/card.css">
</head>

<body>
  <div class="id-card">
    <div class="id-header">
      <h2>SMIT</h2>
      <p>Knowledge Today, Success Tomorrow</p>
    </div>
    <div class="photo">
      <img src="student-photo.jpg" alt="Student Photo">
    </div>
    <div class="details">
      <h3>Raheel</h3>
      <p><strong>Father Name:</strong> haiderr</p>
      <p><strong>Course:</strong> Computer Science</p>
      <p><strong>Gender:</strong> Male</p>
      <p><strong>Age:</strong> 20</p>
      <p><strong>ID Card No.:</strong> SMIT202500123</p>
      <div class="barcode">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTyb_z2vBfzfhnzbQGi3FehrR82tPzaBvjWCA&s"
          alt="Barcode">
        <div class="barcode-text">SMIT202500123</div>
      </div>
    </div>
  </div>
</body>

</html>
